<!doctype html>
<html lang="de-DE">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kalender-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var c = document.getElementById("theme-color");
          if (c) c.setAttribute("content", dark ? "#1c1c1e" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kalender & Mail" />
    <meta name="application-name" content="Kalender & Mail" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/logo.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/logo-dark.png" />
    <title>Kalender & Mail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
